services:
  postgres:
    image: postgres:16
    container_name: event-processor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: event_processor
      POSTGRES_PASSWORD: event_processor
      POSTGRES_DB: event_processor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_processor -d event_processor"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data: